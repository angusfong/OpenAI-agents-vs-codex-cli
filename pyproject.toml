[project]
name = "agents-codex"
version = "0.1.0"
description = "A Codex-CLI-like coding agent built on the OpenAI Agents SDK (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "openai-agents>=0.22.0,<0.23",
    "textual>=1.0",
    "rich>=13.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiohttp>=3.10",
]

[project.scripts]
agents-codex = "agents_codex.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_codex"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
